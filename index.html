<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Finn Sniper</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: var(--tg-theme-bg-color, #0f172a);
            color: var(--tg-theme-text-color, #f8fafc);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        .accent-bg {
            background-color: var(--tg-theme-button-color, #3b82f6);
            color: var(--tg-theme-button-text-color, #ffffff);
        }
        .toast {
            visibility: hidden;
            opacity: 0;
            transition: opacity 0.3s, visibility 0.3s;
        }
        .toast.show {
            visibility: visible;
            opacity: 1;
        }
    </style>
</head>
<body class="p-4 select-none pb-24">
    <!-- Шапка и флаги языков -->
    <header class="flex justify-between items-center mb-5">
        <div>
            <h1 class="text-2xl font-bold tracking-tight">Finn Sniper 🎯</h1>
            <p id="sub-title" class="text-xs text-slate-400">Lynrask kupp-radar for Norge</p>
        </div>
        <div class="flex items-center gap-1 bg-slate-800 p-1 rounded-xl border border-slate-700">
            <button onclick="setLang('no')" id="btn-lang-no" class="px-2 py-1 rounded-lg text-xs font-bold bg-blue-600 text-white">🇳🇴</button>
            <button onclick="setLang('en')" id="btn-lang-en" class="px-2 py-1 rounded-lg text-xs text-slate-400">🇬🇧</button>
            <button onclick="setLang('ru')" id="btn-lang-ru" class="px-2 py-1 rounded-lg text-xs text-slate-400">🇷🇺</button>
            <button onclick="setLang('ua')" id="btn-lang-ua" class="px-2 py-1 rounded-lg text-xs text-slate-400">🇺🇦</button>
            <button onclick="setLang('pl')" id="btn-lang-pl" class="px-2 py-1 rounded-lg text-xs text-slate-400">🇵🇱</button>
        </div>
    </header>

    <!-- Категории с прямым переходом на Finn.no -->
    <section class="mb-5">
        <h2 id="cat-title" class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Hurtigkategorier på Finn.no</h2>
        <div class="grid grid-cols-2 gap-2">
            <button onclick="openCategory('https://www.finn.no/bap/forsale/search.html?price_to=0&trade_type=2&sort=PUBLISHED_DESC')" class="flex items-center gap-2 p-3 bg-slate-800 hover:bg-slate-700/80 border border-slate-700 rounded-xl text-left transition active:scale-95">
                <span class="text-xl">🎁</span>
                <div>
                    <div id="cat-1-t" class="text-sm font-semibold">Gis bort</div>
                    <div id="cat-1-d" class="text-[10px] text-slate-400">Gratis (0 kr) ↗</div>
                </div>
            </button>
            <button onclick="openCategory('https://www.finn.no/bap/forsale/search.html?category=0.93&sub_category=1.93.3215&sort=PUBLISHED_DESC')" class="flex items-center gap-2 p-3 bg-slate-800 hover:bg-slate-700/80 border border-slate-700 rounded-xl text-left transition active:scale-95">
                <span class="text-xl">💻</span>
                <div>
                    <div id="cat-2-t" class="text-sm font-semibold">Tech & Apple</div>
                    <div id="cat-2-d" class="text-[10px] text-slate-400">iPhone / Mac ↗</div>
                </div>
            </button>
            <button onclick="openCategory('https://www.finn.no/bap/forsale/search.html?category=0.67&sub_category=1.67.3911&sort=PUBLISHED_DESC')" class="flex items-center gap-2 p-3 bg-slate-800 hover:bg-slate-700/80 border border-slate-700 rounded-xl text-left transition active:scale-95">
                <span class="text-xl">🛠️</span>
                <div>
                    <div id="cat-3-t" class="text-sm font-semibold">Verktøy</div>
                    <div id="cat-3-d" class="text-[10px] text-slate-400">Proff-utstyr ↗</div>
                </div>
            </button>
            <button onclick="openCategory('https://www.finn.no/bap/forsale/search.html?category=0.78&sort=PUBLISHED_DESC')" class="flex items-center gap-2 p-3 bg-slate-800 hover:bg-slate-700/80 border border-slate-700 rounded-xl text-left transition active:scale-95">
                <span class="text-xl">🛋️</span>
                <div>
                    <div id="cat-4-t" class="text-sm font-semibold">Møbler</div>
                    <div id="cat-4-d" class="text-[10px] text-slate-400">Nordic Vintage ↗</div>
                </div>
            </button>
        </div>
    </section>

    <!-- Шаблоны сообщений в 1 клик -->
    <section class="mb-5">
        <h2 id="tmpl-title" class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Hurtigmeldinger til selger (kopier)</h2>
        <div class="space-y-2">
            <button onclick="copyMsg('Hei! Jeg er veldig interessert og kan hente i dag hvis det passer for deg. Mvh')" class="w-full text-left p-3 bg-slate-800/80 border border-slate-700 rounded-xl active:scale-[0.98] transition">
                <div class="flex justify-between items-center mb-1">
                    <span id="tmpl-1-t" class="text-xs font-bold text-blue-400">🚗 Hente i dag / Sammenkomst</span>
                    <span class="text-[10px] text-slate-500">Kopier 📋</span>
                </div>
                <div class="text-xs text-slate-300">«Hei! Jeg er veldig interessert og kan hente i dag hvis det passer for deg. Mvh»</div>
            </button>

            <button onclick="copyMsg('Hei! Er varen fortsatt tilgjengelig? Kan hente raskt. Mvh')" class="w-full text-left p-3 bg-slate-800/80 border border-slate-700 rounded-xl active:scale-[0.98] transition">
                <div class="flex justify-between items-center mb-1">
                    <span id="tmpl-2-t" class="text-xs font-bold text-emerald-400">⚡ Rask handel</span>
                    <span class="text-[10px] text-slate-500">Kopier 📋</span>
                </div>
                <div class="text-xs text-slate-300">«Hei! Er varen fortsatt tilgjengelig? Kan hente raskt. Mvh»</div>
            </button>

            <button onclick="copyMsg('Hei! Har du mulighet til å sende denne via Fiks ferdig / Posten? Mvh')" class="w-full text-left p-3 bg-slate-800/80 border border-slate-700 rounded-xl active:scale-[0.98] transition">
                <div class="flex justify-between items-center mb-1">
                    <span id="tmpl-3-t" class="text-xs font-bold text-purple-400">📦 Sending med post</span>
                    <span class="text-[10px] text-slate-500">Kopier 📋</span>
                </div>
                <div class="text-xs text-slate-300">«Hei! Har du mulighet til å sende denne via Fiks ferdig / Posten? Mvh»</div>
            </button>
        </div>
    </section>

    <!-- VIP Блок -->
    <section class="bg-gradient-to-r from-amber-500/20 to-orange-500/20 border border-amber-500/30 rounded-2xl p-4 text-center">
        <div class="text-xl mb-1 font-bold flex items-center justify-center gap-1.5">
            <span>⭐</span> <span id="vip-title">VIP Sniper</span>
        </div>
        <p id="vip-sub" class="text-xs text-slate-300 mb-3">Motta varsler på 5–15 sekunder før alle andre!</p>
        <button onclick="buyVipStars()" id="vip-btn" class="w-full py-3 bg-gradient-to-r from-amber-500 to-orange-500 text-white font-bold rounded-xl text-sm shadow-lg active:scale-95 transition">
            ⭐ Aktiver VIP (250 Stars)
        </button>
    </section>

    <!-- Toast уведомление о копировании -->
    <div id="toast" class="toast fixed bottom-4 left-1/2 -translate-x-1/2 bg-blue-600 text-white text-xs font-semibold px-4 py-2 rounded-full shadow-lg pointer-events-none">
        Kopiert til utklippstavle! ✅
    </div>

    <script>
        const tg = window.Telegram ? window.Telegram.WebApp : null;
        if (tg) {
            tg.expand();
            tg.ready();
        }

        const I18N = {
            no: {
                sub: "Lynrask kupp-radar for Norge",
                cat: "Hurtigkategorier på Finn.no",
                c1_t: "Gis bort", c1_d: "Gratis (0 kr) ↗",
                c2_t: "Tech & Apple", c2_d: "iPhone / Mac ↗",
                c3_t: "Verktøy", c3_d: "Proff-utstyr ↗",
                c4_t: "Møbler", c4_d: "Nordic Vintage ↗",
                tmpl: "Hurtigmeldinger til selger (kopier)",
                t1_t: "🚗 Hente i dag / Sammenkomst",
                t2_t: "⚡ Rask handel",
                t3_t: "📦 Sending med post",
                vip_t: "VIP Sniper",
                vip_s: "Motta varsler på 5–15 sekunder før alle andre!",
                vip_b: "⭐ Aktiver VIP (250 Stars)",
                copied: "Kopiert til utklippstavle! ✅"
            },
            ru: {
                sub: "Быстрый радар находок в Норвегии",
                cat: "Быстрый переход по Finn.no",
                c1_t: "Даром (Gis bort)", c1_d: "Бесплатные вещи (0 kr) ↗",
                c2_t: "Техника & Apple", c2_d: "iPhone / MacBook ↗",
                c3_t: "Инструмент", c3_d: "Проф-инструмент ↗",
                c4_t: "Мебель", c4_d: "Скандинавский стиль ↗",
                tmpl: "Шаблоны для продавца (клик = копия)",
                t1_t: "🚗 Заберу сегодня",
                t2_t: "⚡ Быстрая сделка",
                t3_t: "📦 Отправка почтой",
                vip_t: "VIP Sniper Подписка",
                vip_s: "Моментальные пуши за 5–15 сек раньше всех!",
                vip_b: "⭐ Оформить VIP (250 Stars)",
                copied: "Скопировано в буфер! ✅"
            },
            en: {
                sub: "Fast deal sniper for Finn.no",
                cat: "Quick Finn.no categories",
                c1_t: "Giveaway (Gis bort)", c1_d: "Free items (0 kr) ↗",
                c2_t: "Tech & Apple", c2_d: "iPhone / Mac ↗",
                c3_t: "Power Tools", c3_d: "Pro Equipment ↗",
                c4_t: "Furniture", c4_d: "Nordic Vintage ↗",
                tmpl: "Seller Message Templates (tap to copy)",
                t1_t: "🚗 Pickup today",
                t2_t: "⚡ Quick deal",
                t3_t: "📦 Shipping",
                vip_t: "VIP Sniper Pass",
                vip_s: "Instant notifications 5–15s ahead of everyone!",
                vip_b: "⭐ Get VIP (250 Stars)",
                copied: "Copied to clipboard! ✅"
            },
            ua: {
                sub: "Швидкий радар знахідок у Норвегії",
                cat: "Швидкий перехід по Finn.no",
                c1_t: "Безкоштовно", c1_d: "Речі за 0 kr ↗",
                c2_t: "Техніка & Apple", c2_d: "iPhone / Mac ↗",
                c3_t: "Інструмент", c3_d: "Проф-обладнання ↗",
                c4_t: "Меблі", c4_d: "Скандинавський стиль ↗",
                tmpl: "Шаблони для продавця (клік = копія)",
                t1_t: "🚗 Заберу сьогодні",
                t2_t: "⚡ Швидка угода",
                t3_t: "📦 Відправка поштою",
                vip_t: "VIP Sniper Підписка",
                vip_s: "Миттєві сповіщення на 5–15 сек швидше за всіх!",
                vip_b: "⭐ Оформити VIP (250 Stars)",
                copied: "Скопійовано в буфер! ✅"
            },
            pl: {
                sub: "Szybki radar okazji na Finn.no",
                cat: "Kategorie Finn.no",
                c1_t: "Za darmo", c1_d: "Darmowe rzeczy (0 kr) ↗",
                c2_t: "Tech & Apple", c2_d: "iPhone / Mac ↗",
                c3_t: "Narzędzia", c3_d: "Sprzęt profesjonalny ↗",
                c4_t: "Meble", c4_d: "Nordic Vintage ↗",
                tmpl: "Szablony wiadomości (kliknij = kopiuj)",
                t1_t: "🚗 Odbiór dzisiaj",
                t2_t: "⚡ Szybka transakcja",
                t3_t: "📦 Wysyłka pocztą",
                vip_t: "Konto VIP Sniper",
                vip_s: "Powiadomienia w 5–15 sekund przed innymi!",
                vip_b: "⭐ Aktywuj VIP (250 Stars)",
                copied: "Skopiowano do schowka! ✅"
            }
        };

        let currentLang = 'no';

        function setLang(lang) {
            currentLang = lang;
            const t = I18N[lang] || I18N.no;
            document.getElementById('sub-title').innerText = t.sub;
            document.getElementById('cat-title').innerText = t.cat;
            document.getElementById('cat-1-t').innerText = t.c1_t;
            document.getElementById('cat-1-d').innerText = t.c1_d;
            document.getElementById('cat-2-t').innerText = t.c2_t;
            document.getElementById('cat-2-d').innerText = t.c2_d;
            document.getElementById('cat-3-t').innerText = t.c3_t;
            document.getElementById('cat-3-d').innerText = t.c3_d;
            document.getElementById('cat-4-t').innerText = t.c4_t;
            document.getElementById('cat-4-d').innerText = t.c4_d;
            document.getElementById('tmpl-title').innerText = t.tmpl;
            document.getElementById('tmpl-1-t').innerText = t.t1_t;
            document.getElementById('tmpl-2-t').innerText = t.t2_t;
            document.getElementById('tmpl-3-t').innerText = t.t3_t;
            document.getElementById('vip-title').innerText = t.vip_t;
            document.getElementById('vip-sub').innerText = t.vip_s;
            document.getElementById('vip-btn').innerText = t.vip_b;

            ['no', 'en', 'ru', 'ua', 'pl'].forEach(l => {
                const b = document.getElementById('btn-lang-' + l);
                if (l === lang) {
                    b.className = "px-2 py-1 rounded-lg text-xs font-bold bg-blue-600 text-white";
                } else {
                    b.className = "px-2 py-1 rounded-lg text-xs text-slate-400 hover:text-white";
                }
            });

            if (tg && tg.HapticFeedback) tg.HapticFeedback.selectionChanged();
        }

        function openCategory(url) {
            if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
            if (tg) {
                tg.openLink(url);
            } else {
                window.open(url, '_blank');
            }
        }

        function copyMsg(text) {
            navigator.clipboard.writeText(text).then(() => {
                if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
                const toast = document.getElementById('toast');
                const t = I18N[currentLang] || I18N.no;
                toast.innerText = t.copied;
                toast.classList.add('show');
                setTimeout(() => toast.classList.remove('show'), 2000);
            });
        }

        function buyVipStars() {
            if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
            if (tg) {
                tg.close();
            }
        }
    </script>
</body>
</html>
